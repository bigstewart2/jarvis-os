id: read_note
name: Read Note
description: Returns the full content of a note from your Obsidian vault by its relative path. Returns null content if the note does not exist.
voice_invokable: false
input_schema:
  type: object
  properties:
    path:
      type: string
  required:
    - path
output_schema:
  type: object
  properties:
    content:
      type: string
